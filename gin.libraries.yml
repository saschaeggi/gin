global-styling:
  version: VERSION
  css:
    base:
      merge/css/base/variables.css: {}
      merge/css/base/elements.css: {}
      merge/css/base/typography.css: {}
      merge/css/base/print.css: {}
    component:
      merge/css/components/accordion.css: {}
      merge/css/components/action-link.css: {}
      merge/css/components/content-header.css: {}
