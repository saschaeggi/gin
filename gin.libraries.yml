      merge/css/components/button.css: {}
      merge/css/components/details.css: {}
      merge/css/components/divider.css: {}
      merge/css/components/messages.css: {}
      merge/css/components/entity-meta.css: {}
      merge/css/components/fieldset.css: {}
      merge/css/components/form.css: {}
      merge/css/components/form--checkbox-radio.css: {}
      merge/css/components/form--field-multiple.css: {}
      merge/css/components/form--managed-file.css: {}
      merge/css/components/form--text.css: {}
      merge/css/components/form--select.css: {}
      merge/css/components/help.css: {}
      merge/css/components/image-preview.css: {}
      merge/css/components/menus-and-lists.css: {}
      merge/css/components/modules-page.css: {}
      merge/css/components/node.css: {}
      merge/css/components/page-title.css: {}
      merge/css/components/pager.css: {}
      merge/css/components/skip-link.css: {}
      merge/css/components/tables.css: {}
      merge/css/components/table--file-multiple-widget.css: {}
      merge/css/components/search-admin-settings.css: {}
      merge/css/components/tableselect.css: {}
      merge/css/components/tabs.css: {}
    theme:
      merge/css/theme/colors.css: {}
      dist/css/base/gin.css: { minified: false }
    layout:
      merge/css/layout/breadcrumb.css: {}
      merge/css/layout/local-actions.css: {}
      merge/css/layout/layout.css: {}
  dependencies:
    - system/admin
    - core/jquery
    - core/drupal
    # Gin has small and extra small variation for most of the control elements
    # such as inputs, action links, buttons, dropbuttons. For usability and
    # accessibility reasons, we keep target sizes big enough on touch screen
    # devices (by not making these elements smaller than their default size).
    # This library allows conditionally rendering small variations of the
    # control elements on non-touch devices. In some cases, such as when
    # rendering links, it is hard to recognize when this detection should be
    # attached, therefore it is always attached.
    - core/drupal.touchevents-test
    - gin/gin_base

