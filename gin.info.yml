name: Gin
type: theme
base theme: false
description: 'Admin theme with a strong focus on improving the Editorial Experience. Learn more about Gin’s <a href="https://www.drupal.org/docs/contributed-themes/gin-admin-theme/specific-settings-within-gin" target="_blank">Settings</a> and how to customize Gin in our <a href="https://www.drupal.org/docs/contributed-themes/gin-admin-theme/custom-theming" target="_blank">Custom theming guide</a>.'
core_version_requirement: ^11.2

# These dependencies will not allow the installation of Gin at all if gin_toolbar is not activated.
# A bit harsh, so we'll continue to just rely on the composer requirement for now.
# dependencies:
#   - drupal:gin_toolbar
#   - drupal:link

libraries:
  - core/drupal.message
  - core/normalize
  - gin/global-styling

libraries-override:
  core/drupal.tabledrag:
    css:
      component:
        misc/components/tabledrag.module.css: merge/css/components/tabledrag.css
    js:
      misc/tabledrag.js: js/overrides/tabledrag.js

  core/drupal.ajax:
    css:
      component:
        misc/components/ajax-progress.module.css: merge/css/components/ajax-progress.module.css

  core/drupal.autocomplete:
    css:
      component:
        misc/components/autocomplete-loading.module.css: merge/css/components/autocomplete-loading.module.css

  system/status.report: gin/status.report

  system/admin:
    css:
      theme:
        css/system.admin.css: false

  core/drupal.dropbutton:
    css:
      component:
        misc/dropbutton/dropbutton.css: merge/css/components/dropbutton.css

  core/drupal.vertical-tabs:
    css:
      component:
        misc/vertical-tabs.css: false

  core/internal.jquery_ui:
    css:
      theme:
        assets/vendor/jquery.ui/themes/base/theme.css: false

  core/drupal.dialog:
    css:
      component:
        assets/vendor/jquery.ui/themes/base/dialog.css: false

  user/drupal.user:
    css:
      component:
        css/user.module.css: false

  field_ui/drupal.field_ui:
    css:
      theme:
        css/field_ui.admin.css: merge/css/theme/field-ui.admin.css

  node/drupal.node:
    css:
      layout:
        css/node.module.css: false

  node/form:
    css:
      layout:
        css/node.module.css: false

  toolbar/toolbar:
    css:
      component:
        css/toolbar.module.css: merge/css/components/toolbar.module.css
      theme:
        css/toolbar.theme.css: merge/css/theme/toolbar.theme.css
        css/toolbar.icons.theme.css: merge/css/theme/toolbar.icons.theme.css

  toolbar/toolbar.menu:
    css:
      state:
        css/toolbar.menu.css: merge/css/state/toolbar.menu.css

  views_ui/admin.styling:
    css:
      component:
        css/views_ui.admin.css: merge/css/components/views_ui.admin.css
      theme:
        css/views_ui.admin.theme.css: merge/css/theme/views_ui.admin.theme.css

  # Gin overrides: replace
  media_library/view:
    js:
      js/media_library.view.js: js/overrides/media_library.view.js

  core/drupal.tableselect:
    js:
      misc/tableselect.js: js/overrides/tableselect.js

  # Gin overrides: disable
  # needed override to overcome dialog styling issues
  gin/gin.drupal.dialog:
    css:
      theme:
        css/components/dialog.css: false

  core/drupal.dialog.off_canvas:
    css:
      base:
        misc/dialog/off-canvas.base.css: false
        misc/dialog/off-canvas.css: false
        misc/dialog/off-canvas.theme.css: false

  gin/global-styling:
    css:
      layout:
        css/layout/local-actions.css: false
      theme:
        css/theme/colors.css: false

  core/drupal.tableheader:
    js:
      misc/tableheader.js: false
    css:
      component:
        css/components/sticky-header.module.css: false
        misc/components/sticky-header.module.css: false

libraries-extend:
  core/drupal.collapse:
    - gin/details-focus
  core/drupal.dialog:
    - gin/gin.drupal.dialog
    - gin/dialog
  core/drupal.dropbutton:
    - gin/dropbutton
  core/drupal.checkbox:
    - gin/checkbox
  core/drupal.item-list:
    - gin/item-list
  core/drupal.message:
    - gin/messages
  core/drupal.progress:
    - gin/progress
  core/drupal.tabbingmanager:
    - gin/tabbingmanager
  core/drupal.tabledrag:
    - gin/gin.tabledrag
  core/drupal.tableselect:
    - gin/tableselect
  core/drupal.tablesort:
    - gin/drupal.tablesort
  core/drupal.vertical-tabs:
    - gin/vertical-tabs
  file/drupal.file:
    - gin/file
  filter/drupal.filter.admin:
    - gin/filter
  filter/drupal.filter:
    - gin/filter
  system/admin:
    - gin/system.admin
  core/drupal.autocomplete:
    - gin/autocomplete
  shortcut/drupal.shortcut:
    - gin/drupal.shortcut
  core/drupal.ajax:
    - gin/ajax
  user/drupal.user:
    - gin/form.password-confirm
  node/drupal.node.preview:
    - gin/drupal.node.preview
  system/status.report:
    - gin/status.report
  views/views.module:
    - gin/views
  views_ui/admin.styling:
    - gin/views_ui
  media/media_embed_ckeditor_theme:
    - gin/classy.media_embed_ckeditor_theme
    - gin/gin_media_embed_ckeditor_theme
  media_library/ui:
    - gin/media_library.ui
  media_library/view:
    - gin/media_library.theme
    - gin/media_library
  media_library/widget:
    - gin/media_library.theme
    - gin/media_library
  image/admin:
    - gin/image.admin
  core/drupal.tableheader:
    - gin/tableheader
  core/ckeditor:
    - gin/ckeditor
  ckeditor/ckeditor:
    - gin/ckeditor
  core/ckeditor5:
    - gin/ckeditor5
  contextual/drupal.contextual-links:
    - gin/contextual_links
  autosave_form/drupal.autosave_form:
    - gin/autosave
  chosen/drupal.chosen:
    - gin/chosen
  dropzonejs/widget:
    - gin/dropzonejs
  entity_browser/entity_browser:
    - gin/entity_browser
  entity_browser/tabs:
    - gin/entity_browser
  entity_browser/entity_list:
    - gin/entity_browser
  entity_browser/entity_reference:
    - gin/entity_browser
  linkit/linkit.admin:
    - gin/linkit
  module_filter/modules.tabs:
    - gin/module_filter
  module_filter/update.status:
    - gin/module_filter
  module_filter/modules:
    - gin/module_filter
  upgrade_status/upgrade_status.admin:
    - gin/upgrade_status
  webform/webform.filter:
    - gin/webform
  webform_ui/webform_ui:
    - gin/webform
    - gin/webform_ui
  webform/webform.element.help:
    - gin/webform
  webform/webform.element.details.toggle:
    - gin/webform
  webform/webform.form.tabs:
    - gin/webform
  workbench/workbench.toolbar:
   - gin/workbench
  paragraphs/drupal.paragraphs.widget:
    - gin/paragraphs
  entity_reference_layout/erl_widget:
    - gin/entity_reference_layout
    - gin/layout_paragraphs
  layout_paragraphs/layout_paragraphs_widget:
    - gin/layout_paragraphs
  layout_paragraphs/builder:
    - gin/layout_paragraphs2
  responsive_preview/drupal.responsive-preview:
    - gin/responsive_preview
  workspaces/drupal.workspaces.overview:
    - gin/workspaces

ckeditor_stylesheets:
  - dist/css/theme/accent.css
  - dist/css/theme/variables.css
  - dist/css/theme/ckeditor.css

ckeditor5-stylesheets: false

# Regions
regions:
  header: Header
  pre_content: Pre-content
  breadcrumb: Breadcrumb
  highlighted: Highlighted
  help: Help
  content: Content
  page_top: Page top
  page_bottom: Page bottom
  sidebar_first: First sidebar
regions_hidden:
  - sidebar_first
