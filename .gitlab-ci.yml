include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'
variables:
  _CSPELL_IGNORE_PATHS: '"patches/*.*"'
  PROJECT_TYPE: 'theme'
  SKIP_STYLELINT: '1'
  # @todo Enable ESlint and resolve issues.
  SKIP_ESLINT: '1'
  # @todo Enable PHPUnit and resolve issues.
  SKIP_PHPUNIT: '1'
  CORE_STABLE: '11.x-dev'
  OPT_IN_TEST_PREVIOUS_MAJOR: 0
  OPT_IN_TEST_CURRENT: 0
  OPT_IN_TEST_NEXT_MINOR: 1
  OPT_IN_TEST_NEXT_MAJOR: 0
  RUN_JOB_UPGRADE_STATUS: 0
cspell:
  allow_failure: false
phpcs:
  allow_failure: false
phpstan:
  allow_failure: false
phpstan (next minor):
  allow_failure: false
phpstan (next major):
  allow_failure: false
phpunit (previous major):
  allow_failure: false
phpunit (next minor):
  allow_failure: false
phpunit (next major):
  allow_failure: false
upgrade status:
  allow_failure: false
